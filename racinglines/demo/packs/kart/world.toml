# Tracks, in calendar order: twelve Mario Kart 8 Deluxe courses (course = the game's name for it).
#
# Lap times are real. lap_s is the lap the best car runs on a clean lap, 5 % slower than the course's fastest recorded
# lap (wr_lap_s), so no generated lap beats a record (tests/test_demo_store.py). wr_lap_s is the fastest lap split and
# wr_race_s the fastest three-lap time among the 150cc world records in mkwrs.com's mk8dx_wrs.csv (downloaded
# 2026-10-11), over every category. Mount Wario is one point-to-point run in three sections, not three laps: its lap_s
# is 5 % over a third of the record run, and wr_lap_s is its fastest section. The generator reads only lap_s; the
# records are kept beside it as the source.
#
# Then sector shares, trap speeds (km/h: I1, I2, finish line, speed trap), how hard it is to pass (hold_s: seconds lost
# per grid place over a race), safety-car and rain chances. The speeds and hold_s are what the model's track features
# see (sector speed index, places gained). profile = "pasted" tracks take them from the owner's course profiles
# (corners and geometry, pasted 2026-10-12, unverified; library/engineering/2026-10-12-kart-world-data/tracks.md): wide,
# sweeping sectors run about 290-305 km/h, medium ones about 235-260, tight corridors and hairpins about 190-215, and
# narrow or very twisty courses lose more per grid place. profile = "estimated" tracks have no profile yet and keep the
# first kart world's made-up values. The safety-car and rain chances are made up on every track.
