# The kart pack's synthetic world (racinglines/demo/mk_demo/generate.py): the INPUT of the data generator, not a schema. The generator
# turns it into FastF1-shaped files (data/raw/f1/fastf1/<year>/ under the demo data folder) and exchange quotes, which the
# real F1 ingest and the real commands then read. A Mario Kart grid under the real F1 schema: the drivers and teams
# are made up, the tracks' lap times come from real Mario Kart 8 Deluxe records (below), and every pace, result and
# price is invented. Play money; nothing is traded anywhere.

title = "Mario Kart Grand Prix"
seed = 20261011
seasons = [2024, 2025, 2026]     # full seasons, then the season to forecast and run live
rounds = 12                     # per season
raced_2026 = 9                  # rounds 1-9 of 2026 have results; 10-12 are still to race
last_raced = "2026-10-04"       # race day of 2026's last raced round; rounds are 14 days apart
season_start = { 2024 = "2024-03-03", 2025 = "2025-03-02" }
sprint_rounds = [3, 6, 10]      # Sprint weekends (FP1, Sprint Qualifying, Sprint, Qualifying, Race)
race_laps = 24
live_round = 9                  # exchange quotes on the live rehearsal (files/live/f1/demo-2026-09.toml) ...
book_rounds = [10, 11]          # ... and on the pack's sportsbook book's events (book.toml)

# Teams: car pace as a fraction of a lap slower than the best car, and how much faster sectors suit it (slope: the
# deficit's change per unit of sector speed index, (km/h - 250) / 50; negative = faster where the track is fast). The
# slopes come from the team's two drivers' Mario Kart 8 Deluxe stats (mariowiki's in-game statistics, as pasted by the
# owner 2026-10-12): slope = -0.002 x (the pair's mean ground Speed minus ground Handling, less the field's mean), so
# speed characters (Waluigi, Rosalina) gain on fast tracks and handling characters (Koopa Troopa, Shy Guy) on tight ones.
[[teams]]
id = "mushroom"
name = "Mushroom Racing"
pace = 0.000
slope = -0.0026
[[teams]]
id = "koopa"
name = "Koopa Kart Works"
pace = 0.002
slope = -0.0026
[[teams]]
id = "royal"
name = "Royal Racing"
pace = 0.003
slope = 0.0004
[[teams]]
