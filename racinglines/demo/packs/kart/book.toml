# The bundled demo book: `racinglines book map | price | settle --demo`, priced by the real code against the demo store
# (racinglines/demo/store.py: a synthetic database the `--demo` flag builds on first use). A Mario Kart grid under the
# F1 schema: round 10 of 2026 is the Rainbow Road Grand Prix (a sprint weekend), round 11 Wario Stadium; every odds is
# made up. It shows the F1 pricing features `racinglines book price` has: the model kinds a stored forecast prices
# (run `racinglines model forecast kart --demo --save` first), exchange quotes from Kalshi and Polymarket, sides, an h2h
# listed the other way round, sprint fallbacks, an exchange-only kind, a race prop, a same-race combo (priced jointly
# once `racinglines model combo f1 --demo --event 2026-10 ... --save` stored one, else as a flagged product), a
# cross-race parlay, and an unmapped line. A "generic sportsbook" stands in for the venue.

[book]
venue = "book_demo"
event = "2026-10"
sport = "f1"
captured_utc = "2026-10-15T09:00Z"
source = "paste"
odds = "decimal"
currency = "USD"

[aliases]
"Super Mario" = "Mario"

[[lines]]
id = "win"
title = "Race Winner"
selection = "Super Mario"
odds = 3.2
market = { kind = "race_win", driver = "Mario" }

[[lines]]
id = "win-no"
title = "Race Winner: No"
selection = "Luigi not to win"
odds = 1.3
market = { kind = "race_win", driver = "Luigi", side = "no" }

[[lines]]
id = "podium"
title = "Podium Finish"
selection = "Peach"
odds = 2.4
market = { kind = "race_podium", driver = "Peach" }

[[lines]]
id = "top5"
title = "Top 5 Finish"
selection = "Daisy"
odds = 1.9
market = { kind = "race_top5", driver = "Daisy" }

[[lines]]
id = "top10"
title = "Top 10 Finish"
selection = "Bowser"
odds = 1.25
market = { kind = "race_top10", driver = "Bowser" }

[[lines]]
id = "p2"
title = "To Finish 2nd"
selection = "Luigi"
odds = 4.5
market = { kind = "race_p2", driver = "Luigi" }

[[lines]]
id = "pole"
title = "Pole Position"
selection = "Mario"
odds = 2.75
market = { kind = "race_pole", driver = "Mario" }

[[lines]]
id = "fl"
title = "Fastest Lap"
selection = "Luigi"
odds = 5.0
market = { kind = "race_fastest_lap", driver = "Luigi" }

[[lines]]
id = "h2h"
title = "Head to Head"
selection = "Daisy v Peach"
odds = 2.1
market = { kind = "race_h2h", driver = "Daisy", opponent = "Peach" }

[[lines]]
id = "mover"
title = "Biggest Mover"
selection = "Yoshi"
odds = 6.0
market = { kind = "race_biggest_mover", driver = "Yoshi" }

[[lines]]
id = "spr-win"
title = "Sprint Winner"
selection = "Mario"
odds = 2.9
market = { kind = "race_sprint_win", driver = "Mario" }

[[lines]]
id = "spr-pole"
title = "Sprint Pole"
selection = "Luigi"
odds = 4.0
market = { kind = "race_sprint_pole", driver = "Luigi" }

[[lines]]
id = "red"
title = "Red Flag"
selection = "No"
odds = 1.45
market = { kind = "race_red_flag", side = "no" }

[[lines]]
id = "sgp-joint"
title = "Same Race Combo"
selection = "Mario win + Luigi podium"
odds = 4.2
market = { kind = "combo", legs = [
  { kind = "race_win", driver = "Mario" },
  { kind = "race_podium", driver = "Luigi" },
] }

[[lines]]
id = "sgp-product"
title = "Same Race Combo"
selection = "Peach podium + Daisy top 10"
odds = 2.5
market = { kind = "combo", legs = [
  { kind = "race_podium", driver = "Peach" },
  { kind = "race_top10", driver = "Daisy" },
] }

[[lines]]
id = "parlay"
title = "Parlay"
selection = "Mario wins Rainbow Road and Wario Stadium"
market = { kind = "combo", legs = [
  { kind = "race_win", driver = "Mario", odds = 3.2 },
  { kind = "race_win", driver = "Mario", event = "2026-11", odds = 3.0 },
] }

[[lines]]
id = "typo"
title = "Race Winner"
selection = "Maryo"
odds = 3.2
market = { kind = "race_win", driver = "Maryo" }
