name: release

# PyPI releases of racinglines, one per tag, from this repo. Every commit here is one release, pushed with its tag by
# the private repo's release job (an allowlist export: only the files oss/manifest.toml lists there ever reach this
# repo). This workflow builds the tagged tree exactly as it is, smoke-tests it, and uploads it, so each PyPI version's
# provenance names a commit you can read here.
#
#   v1.0.1rc1, v1.0.1a1, v1.0.1b1   build + smoke, then TestPyPI only (a dry run)
#   v1.0.1                          build + smoke, TestPyPI, then PyPI once a reviewer approves `pypi`
#
# No API tokens: both indexes trust this workflow by OIDC (trusted publishing).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # the floor in pyproject's requires-python

      - name: Version from the tag
        id: version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          case "$ver" in *a*|*b*|*rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - name: Build, check and smoke-test the wheel (plain MIT required, version must match the tag)
        env:
          RELEASE: "1"
          EXPECT_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release/package_smoke.sh "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/racinglines
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: [build, testpypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi                          # required reviewer: the owner (the go for an upload that can't be undone)
      url: https://pypi.org/p/racinglines
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
