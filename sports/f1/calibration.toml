# Walk-forward calibration power for F1 race-win prices (C48; racinglines/models/calibration.py).
#
# The simulation's win chances p_i are mapped to p_i^a / sum_j p_j^a and every simulated race is resampled to match
# (so podium, top 10, head-to-head and constructor prices move with the win price). a > 1 sharpens the favourites.
# The `calib_power` setting turns it on: unset = off (every key unchanged), "walk_forward" = this table, a number =
# that power at every stage.
#
# Each fit row is the power that minimised the winner's log loss over every race finished before `from` (a grid of
# a = 1.0 to 4.0 in 0.1 steps), so a price with a cutoff on or after `from` only uses earlier races (the as-of rule).
# `from` is two days after the last race in the fit (a night race can end after midnight UTC).
#   grid    stages where the starting grid is known (after qualifying)
#   nogrid  stages before it (pre-weekend, practice, sprint sessions)
#   races   races in the fit
# Source: scripts/models/fit_calibration.py --sims 4000 --check, on the as-of stage prices of the default model
# (gridq+pretrain+reset, calib_power unset) from `racinglines strategy sweep f1 --year 2025|2026 --sims 4000`, 39 Grands Prix
# 2025-01 to 2026-15 (the cloud data bucket's database, built 2026-10-14). Refit on the VM after each race to add rows.
# A cutoff before the first `from` gets no calibration (a = 1): fewer than 8 races to fit on.
# Rebuild: docs/f1-calibration.md.

[[fit]]
from = 2025-05-27
grid = 2.6
nogrid = 2.6
races = 8
