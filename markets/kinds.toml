# F1 sprint weekends (Kalshi's KXF1SPRINTPOLE / KXF1RACESPRINT, docs/todo.md U5): the sprint qualifying order and the
# sprint classification are earlier rounds of the weekend, priced like pole from sims.stage_rank["sprint_qual"] /
# ["sprint"] when a model simulates them

[[kinds]]
code = "race_sprint_pole"
label = "Sprint pole"
payoff = "stage_top_n"
n = 1
stage = "sprint_qual"

[[kinds]]
code = "race_sprint_win"
label = "Sprint winner"
payoff = "stage_top_n"
n = 1
stage = "sprint"

# A yes/no the model draws itself in each simulation (sims.indicators[code]). F1's fastest lap is drawn by position_sim
# behind its `fastlap` variant (model.FASTEST_LAP, off by default) and stored as race_predictions.extra.fl_prob; the
# classification doesn't record it, so it can't be settled from F1's results. NASCAR's is drawn by the GlobalModel from
# each race's best-lap order ([model] best_lap in sports/nascar.toml) and settles on the race's laps when all are stored

[[kinds]]
code = "race_fastest_lap"
label = "Fastest lap"
payoff = "indicator"

# Kalshi's KXF1TOP5 and KXF1BIGGESTMOVER: F1 position_sim stores them as extra.top5_prob / extra.mover_prob. Biggest
# mover: the classified driver with the largest gain from the starting grid to the finish, if anyone gained; every
# driver tied on that gain counts as YES (docs/f1-roadmap.md decision log, 2026-10-04)

[[kinds]]
code = "race_top5"
label = "Top 5"
payoff = "top_n"
n = 5
default = false

[[kinds]]
code = "race_biggest_mover"
label = "Biggest mover"
payoff = "mover"
stage = "qual"
default = false

