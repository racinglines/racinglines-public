# Every market kind, one [[kinds]] table per kind: the registry racinglines/markets/kinds.py KINDS, in this file's
# order (db/reads.PREDICTION_KINDS is derived from it). A new market type is a new table here; code changes only for a
# new predicate, aggregate or comparison (owner, 2026-10-06: "as few conditional code switches in the model, and more
# generalized support functions who's inputs are set by the schemas").
#
# Common fields
#   code       the prediction kind (market_links.prediction, at most 30 characters)
#   label      the display name
#   default    false: priced only when named (left out of kinds.summary(), the prediction records and the walk-forward
#              default set, so adding a kind changes no existing output and no golden test). Default true for the
#              legacy payoffs; a declarative kind must say false
#   session    an earlier round raced as its own classification (F1: "sprint", "qual"): priced on sims.at(session),
#              settled on the result frame's <session>_ columns
#
# Two kinds of payoff:
#
# 1. payoff = "<name>": a legacy payoff, one function each in racinglines/markets/kinds.py, inputs from the row:
#      top_n        n            rank <= n and finished; settles on status OK and position <= n (absent: NO)
#      stage_top_n  n, stage     an earlier round's order (sims.stage_rank[stage]) <= n; settles on <stage>_position
#                                (qual_position for "qual")
#      reached      stage        the entrant reached the round (sims.reached[stage]); settles on reached_<stage>
#      h2h                       P(a classified ahead of b); settles on positions (params.opponent_id)
#      group_top                 the team scoring the most points (ties split); settles on summed points (params.team)
#      indicator                 a yes/no the model draws itself (sims.indicators[code]); settles on the results' <code>
#                                column when the frame has one (GlobalModel's best lap), else undecided
#      mover        stage        priced: the biggest gain from the <stage> order to the finish; settled from the race
#                                round's stored starting grid (results.extra.grid; payoffs.biggest_mover), else undecided
#      standings    n, exact     season-long, priced by kinds.season_fair from a season simulation (outcomes.SeasonSims,
#                   subject      drivers or, with subject = "team", constructors): P(standings position <= n), or == n
#                                with exact = true. Without n: its own rule in season_fair (season_wins_ge,
#                                standings_h2h). Settled by the venue's resolution, never from one race's results
#    Their fair values feed the golden tests and the live book: a row keeps its payoff until a promotion
#    (docs/f1-roadmap.md) moves it onto a spec. Every legacy row comes before the first declarative one.
#
# 2. payoff = { ... }: a declarative spec, priced and settled by the two generic functions of
#    racinglines/markets/payoffs.py (payoffs.fair, payoffs.settle):
#
#    subject    driver | team | field           who a selection names (field: the whole race, one yes/no with a line)
#    predicate  what holds for one car, on the simulations / on the results frame:
#               classified        finished / status OK
#               retired           not finished / status DNF or DSQ (a DNS is void)
#               top        n      rank <= n and finished / OK and position <= n
#               position   n      rank == n and finished / OK and position == n (an exact finishing place)
#               stage_top  n, stage   sims.stage_rank[stage] <= n / <stage>_position <= n (qual_position for "qual");
#                                 a car with no position is NO once anyone has one, undecided while nobody has
#               indicator  of     sims.indicators[of] (a yes/no the model draws, e.g. race_fastest_lap) / the results'
#                                 <of> column when the frame has one, else undecided
#               points            the points the car scores (sims.points) / the results' points (a number, not a yes/no)
#               last_classified   the worst-ranked classified car (ties all) / OK and position == the worst OK position
#               nth_retired n     1 / n_dnf for every retiring car in a simulation with at least n retirements (the
#                                 uniform timing assumption) / competition rank of laps_completed among the DNFs == n
#    aggregate  any | all | sum | count | total     how a team's or the field's cars combine (omitted for driver);
#               total sums a number (points), the others count yes/no values
#    compare    over                         P(aggregate > line); the line is given when pricing or settling
#               rank    place                the team's place among all teams by aggregate == place
#               ahead                        the team ahead of params.opponent (another team) by aggregate
#               Teams in rank and ahead are ordered by the aggregate, then by their best-placed car (the constructors'
#               countback: no two teams tie unless neither has a car ranked); a tie that remains splits the place in
#               pricing and leaves the market undecided in settlement
#    [kinds.settle]   optional: overrides of the payoff spec for settlement, plus
#    absent     no | void                    a driver missing from the results settles NO or void (default void)
# wx    optional: how a probability of rain moves the price (racinglines/markets/kinds.py Kind.wx). "dnf": priced from
#       drivers' dnf_prob scaled by props.wx_scale (the circuit's wet-or-dry retirement rate,
#       models/props.py) when a probability of rain is given; set on every kind whose predicate is
#       classified, retired, last_classified or nth_retired. Omitted: weather doesn't move it.
#
# Settlement details for the declarative predicates: classified = status OK; retired = status DNF or DSQ (a DNS is
# void); last_classified is void when nobody is classified; nth_retired counts status DNF only (a DSQ is decided after
# the flag), is void without a laps_completed for every DNF, and is NO for everyone when nobody retired.

