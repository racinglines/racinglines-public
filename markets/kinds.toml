# Team aggregates over the pole and the fastest lap (Polymarket's "<GP>: Constructor Pole Position" / "Constructor
# Fastest Lap"). The fastest lap is drawn only by position_sim's `fastlap` variant and is not in the results: the
# constructor fastest lap prices from such a run and settles by the venue, as race_fastest_lap

[[kinds]]
code = "race_constructor_pole"
label = "Constructor pole position"
default = false
payoff = { subject = "team", predicate = "stage_top", stage = "qual", n = 1, aggregate = "any" }

[[kinds]]
code = "race_constructor_fastest_lap"
label = "Constructor fastest lap"
default = false
payoff = { subject = "team", predicate = "indicator", of = "race_fastest_lap", aggregate = "any" }

# A team's points in the race, ranked (Polymarket's "<GP>: Which Constructor scores 2nd?" to "5th?"; 1st is
# race_constructor_top), and two teams head to head ("<GP> – Constructor Matchups")

[[kinds]]
code = "race_constructor_p2"
label = "Constructor scores 2nd"
default = false
payoff = { subject = "team", predicate = "points", aggregate = "total", compare = "rank", place = 2 }

[[kinds]]
code = "race_constructor_p3"
label = "Constructor scores 3rd"
default = false
payoff = { subject = "team", predicate = "points", aggregate = "total", compare = "rank", place = 3 }

[[kinds]]
code = "race_constructor_p4"
label = "Constructor scores 4th"
default = false
payoff = { subject = "team", predicate = "points", aggregate = "total", compare = "rank", place = 4 }

[[kinds]]
code = "race_constructor_p5"
label = "Constructor scores 5th"
default = false
payoff = { subject = "team", predicate = "points", aggregate = "total", compare = "rank", place = 5 }

[[kinds]]
code = "race_constructor_h2h"
label = "Constructor head-to-head"
default = false
payoff = { subject = "team", predicate = "points", aggregate = "total", compare = "ahead" }

# Both of a team's cars on the podium (Polymarket's "Constructor to double podium at <GP>?")

[[kinds]]
code = "race_team_double_podium"
label = "Double podium"
default = false
payoff = { subject = "team", predicate = "top", n = 3, aggregate = "all" }

# Practice fastest lap (Polymarket's "<GP>: Practice 1 / 2 / 3 Fastest Lap"; C12b): who sets the session's fastest lap.
# Priced from sims.stage_rank["fp<n>"], each practice session's order of best laps that position_sim draws behind its
# `practicefast` variant (model.PRACTICE_FASTEST, off by default; the real order once the session has run); settled on
# the results' fp<n>_position, the session's order of best laps from the stored laps (models/inputs/practice.py):
# undecidable when the session's laps aren't stored. A driver who set no lap in a session that ran is a NO

[[kinds]]
code = "race_fp1_fastest"
label = "Practice 1 fastest lap"
default = false
payoff = { subject = "driver", predicate = "stage_top", stage = "fp1", n = 1 }
settle = { absent = "no" }

[[kinds]]
code = "race_fp2_fastest"
label = "Practice 2 fastest lap"
default = false
payoff = { subject = "driver", predicate = "stage_top", stage = "fp2", n = 1 }
settle = { absent = "no" }

[[kinds]]
code = "race_fp3_fastest"
label = "Practice 3 fastest lap"
default = false
payoff = { subject = "driver", predicate = "stage_top", stage = "fp3", n = 1 }
settle = { absent = "no" }
